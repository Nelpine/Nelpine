<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="Starlight divider">
<defs><linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="1200" y2="14"><stop stop-color="#71F0DF" stop-opacity="0"/><stop offset=".5" stop-color="#71F0DF" stop-opacity=".45"/><stop offset="1" stop-color="#A58BFA" stop-opacity="0"/></linearGradient><linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="100" y2="14"><stop stop-color="#71F0DF" stop-opacity="0"/><stop offset="1" stop-color="#71F0DF"/></linearGradient></defs>
<style>.traveler{animation:travel 12s ease-in-out infinite}@keyframes travel{0%{transform:translateX(-200px);opacity:0}20%,75%{opacity:.9}100%{transform:translateX(1200px);opacity:0}}@media(prefers-reduced-motion:reduce){.traveler{animation:none;opacity:.4}}</style>
<path d="M0 14H1200" stroke="url(#line)" stroke-width="1"/>
<g class="traveler"><path d="M0 14H100" stroke="url(#tail)"/><circle cx="100" cy="14" r="2.2" fill="#71F0DF"/></g></svg>