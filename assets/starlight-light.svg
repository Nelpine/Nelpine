<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="Starlight divider">
<defs><linearGradient id="line"><stop stop-color="#A2F2E2" stop-opacity="0"/><stop offset=".5" stop-color="#A2F2E2" stop-opacity=".45"/><stop offset="1" stop-color="#D1B6FF" stop-opacity="0"/></linearGradient><linearGradient id="tail"><stop stop-color="#A2F2E2" stop-opacity="0"/><stop offset="1" stop-color="#A2F2E2"/></linearGradient></defs>
<style>.traveler{animation:travel 12s ease-in-out infinite}@keyframes travel{0%{transform:translateX(-200px);opacity:0}20%,75%{opacity:.9}100%{transform:translateX(1200px);opacity:0}}@media(prefers-reduced-motion:reduce){.traveler{animation:none;opacity:.4}}</style>
<path d="M0 14H1200" stroke="url(#line)" stroke-width="1"/>
<g class="traveler"><path d="M0 14H100" stroke="url(#tail)"/><circle cx="100" cy="14" r="2.2" fill="#A2F2E2"/></g></svg>