<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-labelledby="title desc">
<title id="title">Nelpine · Java Backend / Web Development</title><desc id="desc">Animated metallic name with moving edge highlights, outline tracing, a light sweep and six floating technology icons.</desc>
<defs><linearGradient id="name" x1="0" y1="0" x2="1" y2=".6"><stop offset="0.0" stop-color="#244566"/><stop offset="0.25" stop-color="#4978A4"/><stop offset="0.5" stop-color="#277E90"/><stop offset="0.75" stop-color="#66599A"/><stop offset="1.0" stop-color="#274C75"/></linearGradient><linearGradient id="sweep"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><clipPath id="word"><text x="51" y="173" font-family="Segoe UI,Arial,sans-serif" font-size="108" font-weight="650" letter-spacing="-5">Nelpine</text></clipPath><clipPath id="frame"><rect x="1" y="1" width="1098" height="278" rx="18"/></clipPath><filter id="type-glow" x="-25%" y="-45%" width="150%" height="190%"><feGaussianBlur stdDeviation="3"/></filter>
<linearGradient id="stroke" gradientUnits="userSpaceOnUse" x1="50" y1="90" x2="510" y2="180"><stop stop-color="#9DE9F2"/><stop offset=".5" stop-color="#A6B6FF"/><stop offset="1" stop-color="#DCF9FF"/></linearGradient>
<linearGradient id="underline" gradientUnits="userSpaceOnUse" x1="54" x2="524"><stop stop-color="#8BCEDC" stop-opacity="0"/><stop offset=".5" stop-color="#A6B6FF" stop-opacity=".75"/><stop offset="1" stop-color="#8BCEDC" stop-opacity="0"/></linearGradient></defs>
<style>
.shine{animation:shine 5.5s ease-in-out infinite}
.outline{stroke-dasharray:55 180;animation:trace 8s linear infinite}
.type-halo{animation:halo 6s ease-in-out infinite}
.edge-a{animation:edge 7s ease-in-out infinite}
.edge-b{animation:edge 7s ease-in-out -3.5s infinite reverse}
.node{animation:float 6s ease-in-out infinite}
.signal{stroke-dasharray:35 530;animation:signal 12s linear infinite}
.underline{stroke-dasharray:75 500;animation:signal 7s linear infinite}
@keyframes shine{0%,10%{transform:translateX(-380px) skewX(-12deg)}65%,100%{transform:translateX(650px) skewX(-12deg)}}
@keyframes trace{to{stroke-dashoffset:-940}}
@keyframes halo{0%,100%{opacity:.1}50%{opacity:.32}}
@keyframes edge{0%,38%,65%,100%{opacity:.12;transform:translateX(0)}48%{opacity:.4;transform:translateX(1.4px)}55%{opacity:.18;transform:translateX(-.6px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes signal{to{stroke-dashoffset:-565}}
@media(prefers-reduced-motion:reduce){.shine,.outline,.type-halo,.edge-a,.edge-b,.node,.signal,.underline{animation:none}.shine,.edge-a,.edge-b{display:none}.outline{stroke-dasharray:none;opacity:.2}}
</style>
