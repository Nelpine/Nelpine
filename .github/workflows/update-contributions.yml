name: Update contribution calendar

on:
  schedule:
    # 09:23 Asia/Shanghai (01:23 UTC).
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_contributions.py'
      - 'scripts/calendar_design.py'
      - 'scripts/test_render_contributions.py'
      - '.github/workflows/update-contributions.yml'

permissions:
  contents: write

concurrency:
  group: contribution-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check calendar parsing
        run: python3 -m unittest discover -s scripts -p 'test_render_contributions.py'
      - name: Render public contribution calendar
        run: python3 scripts/render_contributions.py
      - name: Commit updated chart assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions/
          if git diff --cached --quiet; then
            echo 'Contribution data is unchanged.'
            exit 0
          fi
          git commit -m 'Update public contribution calendar [skip ci]'
          git push
